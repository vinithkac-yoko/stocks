<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Daily 10</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <h1>Daily 10</h1>
      <span class="chip" id="asOf" hidden></span>
      <span class="chip" id="mode" hidden></span>
      <span class="spacer"></span>
      <button class="btn quiet sm" data-action="theme" title="Switch light / dark / auto">Theme</button>
      <button class="btn quiet sm" data-action="signout" id="signout" hidden>Sign out</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Views" hidden>
      <button data-action="tab" data-tab="today">Today</button>
      <button data-action="tab" data-tab="portfolio">Portfolio</button>
      <button data-action="tab" data-tab="history">History</button>
    </nav>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>
  <main id="app" tabindex="-1"><p class="muted pad">Loading…</p></main>

  <dialog id="investDialog">
    <form method="dialog" id="investForm" autocomplete="off">
      <h2 id="investTitle">Mark as invested</h2>
      <p class="muted" id="investSub"></p>
      <label>Entry price (₹)
        <input name="price" type="number" inputmode="decimal" step="any" min="0.01" required>
      </label>
      <label>Quantity
        <input name="qty" type="number" inputmode="numeric" step="1" min="1" required>
      </label>
      <label>Date
        <input name="date" type="date" required>
      </label>
      <p class="muted" id="investTotal" aria-live="polite"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" data-action="close-dialog">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
