name: Update NSE data and deploy

on:
  schedule:
    # NSE publishes the day's bhavcopy in the evening. 19:00 IST, then a retry at 21:00 IST
    # in case it was late. The script is idempotent, so a second run is harmless.
    - cron: "30 13 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Fetch NSE data
        if: github.event_name != 'push'
        run: python scripts/update_data.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update NSE data"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
